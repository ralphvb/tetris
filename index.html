<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <label class="theme-switch" aria-label="Cambiar entre modo oscuro y modo claro">
      <input type="checkbox" id="theme-toggle" />
      <span class="theme-switch-track"></span>
    </label>

    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section" id="hold-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section hidden" id="combo-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">×1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section" id="skills-section">
          <span class="label">ENERGÍA</span>
          <div class="energy-bar">
            <div class="energy-fill" id="energy-fill"></div>
          </div>
          <ul class="skills-list">
            <li><kbd>1</kbd> ver 5 siguientes (20)</li>
            <li><kbd>2</kbd> cambiar pieza (30)</li>
            <li><kbd>3</kbd> ralentizar (40)</li>
            <li><kbd>4</kbd> deshacer (60)</li>
            <li><kbd>5</kbd> reservar (10)</li>
          </ul>
        </div>

        <div class="panel-section hidden" id="preview-section">
          <span class="label">PRÓXIMAS</span>
          <div class="preview-chips" id="preview-chips"></div>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd> reservar</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <!-- Módulos ES: requiere servir el proyecto por HTTP (ver README). -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
