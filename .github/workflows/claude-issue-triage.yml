name: Claude Issue Triage

# Cuando se abre o edita un issue, Claude lo analiza: le asigna labels del
# catálogo de .github/labels.yml y publica un diagnóstico funcional en español
# (en Markdown de GitHub, sin detalles del código a modificar).
#
# No escribe código ni abre PRs: para eso, comenta "@claude ..." en el issue
# (lo atiende claude.yml).
on:
  issues:
    types: [opened, edited]

# Si el issue se edita varias veces seguidas, cancela el análisis anterior.
concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Se salta los issues de bots, los ya cerrados y los que mencionan @claude
    # (esos los gestiona claude.yml, que también dispara en issues abiertos).
    if: |
      github.event.issue.state == 'open' &&
      github.event.issue.user.type != 'Bot' &&
      !contains(github.event.issue.body, '@claude') &&
      !contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Check Anthropic credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Falta el secret CLAUDE_CODE_OAUTH_TOKEN. Genéralo con 'claude setup-token' y guárdalo con 'gh secret set CLAUDE_CODE_OAUTH_TOKEN'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Solo lectura del repo + las operaciones gh necesarias. Write está
          # permitido únicamente para redactar el comentario en un archivo
          # temporal; no hay Edit, ni push, ni contents: write.
          claude_args: '--allowedTools "Read,Grep,Glob,Write,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh api:*)"'
          prompt: |
            Eres el triador de issues del repositorio ${{ github.repository }}: un
            Tetris en JavaScript vanilla (HTML5 Canvas), sin build, sin bundler y
            sin tests. La lógica vive en los módulos ES de `src/`; la vista en
            `index.html` y `style.css`. Lee `CLAUDE.md` del checkout antes de
            empezar: describe la arquitectura y las convenciones del proyecto.

            Tu tarea sobre el issue #${{ github.event.issue.number }} es doble:
            etiquetarlo y diagnosticarlo. NO escribas código, NO crees ramas ni
            pull requests, y NO modifiques el título ni el cuerpo del issue
            (editar el cuerpo re-dispararía este mismo workflow).

            ## 1. Leer el issue y el código

            Lee el issue con:
                gh issue view ${{ github.event.issue.number }} --json title,body,labels,comments

            Después LEE EL CÓDIGO relevante antes de opinar (los módulos de
            `src/`, `index.html`, `style.css`). Un diagnóstico sin haber abierto
            los archivos no sirve.

            ## 2. Asignar labels

            Elige SOLO de esta lista cerrada. No inventes ni crees labels nuevos;
            si ninguno encaja, deja esa categoría vacía.

            - Tipo (elige 1): `bug`, `enhancement`, `documentation`, `refactor`, `question`
            - Área (elige 1 o 2): `gameplay`, `ui`, `controls`, `scoring`, `rendering`, `performance`
            - Prioridad (elige 1): `prioridad-alta` (rompe el juego), `prioridad-media` (molesto, hay alternativa), `prioridad-baja` (detalle menor)
            - Meta (opcional): `needs-info` si no hay pasos de reproducción claros; `good-first-issue` si el arreglo es pequeño y localizado; `roadmap` si el issue corresponde a una de las mejoras de `docs/upgrades/`

            Guía de áreas: `gameplay` → `src/actions.js`, `src/board.js`,
            `src/pieces.js` y el bucle de `src/main.js`; `rendering` →
            `src/render.js` (draw, drawBlock, ghost, vista previa); `controls` →
            `src/input.js`; `scoring` → `src/scoring.js` y `src/config.js`;
            `ui` → `index.html`, `style.css` y `src/hud.js`.

            Aplícalos con:
                gh issue edit ${{ github.event.issue.number }} --add-label "label1,label2"

            Si el issue ya tenía labels de este catálogo que ya no aplican,
            quítalos con `--remove-label`. Nunca toques labels ajenos al catálogo.

            ## 3. Publicar el diagnóstico

            Redacta el comentario EN ESPAÑOL, empezando exactamente con la línea
            `<!-- claude-triage -->` y con estas secciones en este orden:

            **Resumen** — qué reporta el issue, en 1-2 frases.
            **Causa probable** — la hipótesis, descrita en términos de
            comportamiento del juego (qué mecánica falla y en qué situación).
            **Alcance** — qué parte de la experiencia se ve afectada (jugabilidad,
            controles, interfaz, puntuación, dibujado, rendimiento).
            **Cómo reproducir** — pasos concretos en el navegador; si el issue no
            los da, indica qué falta.
            **Confianza** — alta / media / baja, y por qué.

            Sé concreto y breve. Si el issue es vago, dilo claramente, marca
            `needs-info`, pregunta lo que falta y declara confianza baja.

            ### Formato del comentario

            Escríbelo en Markdown válido para GitHub (GitHub Flavored Markdown),
            de modo que se renderice bien en la web: usa encabezados `###` para
            cada sección, listas con `-`, listas numeradas para los pasos de
            reproducción y **negritas** para lo importante. No uses HTML crudo
            (salvo el marcador `<!-- claude-triage -->` de la primera línea) ni
            tablas innecesarias.

            ### Qué NO exponer

            Lees el código solo para orientarte: el comentario es un diagnóstico
            funcional, NO una guía de implementación. En el comentario publicado
            NO incluyas:

            - nombres de archivos ni rutas (`src/main.js`, `index.html`, `style.css`)
            - nombres de funciones, variables o constantes del proyecto
            - números de línea ni referencias del tipo `src/main.js:24`
            - fragmentos de código, diffs, pseudocódigo o bloques ``` con código
            - instrucciones sobre qué modificar o cómo implementar el arreglo

            Describe el problema y su efecto para quien juega; deja el "cómo
            arreglarlo" para el PR.

            ## 4. Comentario único (sticky)

            No acumules comentarios: reutiliza el tuyo. Busca en los comentarios
            del issue uno que empiece por `<!-- claude-triage -->`:

            - Si existe, actualízalo (usa su `id` de la salida JSON de
              `gh issue view ... --json comments`):
                  gh api -X PATCH /repos/${{ github.repository }}/issues/comments/ID -f body=@archivo.md
            - Si no existe, créalo:
                  gh issue comment ${{ github.event.issue.number }} --body-file archivo.md

            Escribe el cuerpo en un archivo temporal bajo `/tmp` (nunca dentro
            del repositorio) y pásalo con `--body-file` / `-f body=@archivo`
            para no romper el markdown al escapar comillas.
